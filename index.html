<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slot Guard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --ink:#0F1115; --ink-2:#3F4450; --muted:#7A7F8A; --line:#ECECEA; --line-2:#E2E2DF;
  --accent:#4F46E5; --accent-2:#EEF0FF; --accent-ink:#3730A3;
  --green:#15803D; --green-bg:#EAF7EF; --amber:#B45309; --amber-bg:#FDF4E7; --red:#C2410C; --red-bg:#FDEEE8;
  --violet:#7C3AED; --violet-bg:#F3EEFF; --grey-bg:#F1F1EF;
  --r:12px; --r-sm:8px; --shadow:0 1px 2px rgba(16,17,21,.04),0 4px 16px rgba(16,17,21,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;transition:.15s}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#262A33}
.btn-primary:disabled{background:#C9CBD0;cursor:not-allowed}
.btn-ghost{border:1px solid var(--line-2);background:var(--surface)}
.btn-ghost:hover{background:#F4F4F2}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:#4338CA}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.link{color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-green{background:var(--green-bg);color:var(--green)}
.p-amber{background:var(--amber-bg);color:var(--amber)}
.p-red{background:var(--red-bg);color:var(--red)}
.p-violet{background:var(--violet-bg);color:var(--violet)}
.p-grey{background:var(--grey-bg);color:var(--muted)}
.p-blue{background:var(--accent-2);color:var(--accent-ink)}
.tag.tpl{cursor:pointer;background:var(--surface);border:1px solid var(--line-2);height:26px}
.tag.tpl:hover{border-color:var(--accent);color:var(--accent)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--grey-bg);color:var(--ink-2);font-size:12px;font-weight:500}

/* layout bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.2px}
.logo-mark{width:28px;height:28px;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.logo-mark svg{width:16px;height:16px;stroke:#fff}
h1,h2,h3{letter-spacing:-.02em;margin:0}
.eyebrow{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}

/* ---------- landing ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;max-width:1160px;margin:0 auto;padding:20px 24px}
.nav-links{display:flex;gap:28px;color:var(--ink-2);font-weight:500}
.hero{max-width:1160px;margin:0 auto;padding:48px 24px 24px;display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.hero h1{font-size:52px;line-height:1.05;letter-spacing:-.035em;margin:14px 0 18px}
.hero p.lead{font-size:18px;color:var(--ink-2);max-width:500px;margin:0 0 28px}
.badge-new{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.badge-new b{background:var(--accent-2);color:var(--accent-ink);padding:2px 8px;border-radius:999px;font-size:12px}
.hero-visual{position:relative}
.hv-card{padding:18px}
.hv-row{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.hv-row:last-child{border-bottom:0}
.hv-toast{position:absolute;right:-18px;bottom:-22px;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--ink);color:#fff;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);font-size:13px}
.hv-toast .dot{width:28px;height:28px;border-radius:50%;background:#22C55E;display:grid;place-items:center}
.hv-toast .dot svg{stroke:#fff;width:14px;height:14px}
.stats{max-width:1160px;margin:24px auto 0;padding:0 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{padding:22px}
.stat .n{font-size:30px;font-weight:700;letter-spacing:-.03em}
.section{max-width:1160px;margin:0 auto;padding:72px 24px 24px}
.section h2{font-size:32px;margin:8px 0 28px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step{padding:22px}
.step .num{width:32px;height:32px;border-radius:9px;background:var(--accent-2);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;margin-bottom:14px}
.step h3{font-size:16px;margin-bottom:6px}
.step p{margin:0;color:var(--ink-2);font-size:13.5px}
.cta-band{max-width:1112px;margin:56px auto 0;padding:40px;border-radius:20px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:24px}
.cta-band h2{font-size:28px}
.cta-band .btn-primary{background:#fff;color:var(--ink)}
footer.foot{max-width:1160px;margin:0 auto;padding:32px 24px 40px;color:var(--muted);font-size:13px}

/* ---------- onboarding shell ---------- */
.ob-top{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.stepper{display:flex;align-items:center;gap:10px}
.st{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted)}
.st .c{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:700}
.st.on{color:var(--ink)} .st.on .c{border-color:var(--ink);background:var(--ink);color:#fff}
.st.done{color:var(--ink-2)} .st.done .c{border-color:var(--green);background:var(--green);color:#fff}
.st-line{width:28px;height:1.5px;background:var(--line-2)}
.ob-wrap{max-width:820px;margin:40px auto 80px;padding:0 24px}
.ob-head h1{font-size:28px;margin-bottom:6px}
.ob-head p{margin:0 0 24px;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13px;font-weight:600}
.input,.textarea,.select{width:100%;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:10px 12px;outline:none;transition:.15s}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.textarea{min-height:220px;resize:vertical;line-height:1.55}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.seg{display:inline-flex;padding:3px;background:var(--grey-bg);border-radius:10px;gap:2px}
.seg button{height:32px;padding:0 14px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.drop{border:1.5px dashed var(--line-2);border-radius:12px;padding:40px;text-align:center;background:var(--surface);transition:.15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-2)}
.drop .ic{width:44px;height:44px;border-radius:12px;background:var(--grey-bg);display:grid;place-items:center;margin:0 auto 12px}
.file-chip{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:12px}
.ob-foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px}

/* loader */
.gen{padding:40px;text-align:center}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--accent-2);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-steps{text-align:left;max-width:340px;margin:20px auto 0;display:flex;flex-direction:column;gap:10px}
.gen-step{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;transition:.2s}
.gen-step .b{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center}
.gen-step.done{color:var(--ink)} .gen-step.done .b{background:var(--green);border-color:var(--green)}
.gen-step.done .b svg{stroke:#fff;width:12px;height:12px}

/* review */
.rv{display:grid;grid-template-columns:280px 1fr;gap:24px;max-width:1080px;margin:40px auto 80px;padding:0 24px;align-items:start}
.rv-side{position:sticky;top:88px;padding:20px}
.kv{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font-weight:600}
.notice{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--accent-2);color:var(--accent-ink);margin-bottom:20px;font-size:13.5px}
.notice svg{margin-top:2px}
.q-sec{padding:20px;margin-bottom:16px}
.q-sec-h{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.q-sec-h h3{font-size:16px}
.q-sec-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.q{display:grid;grid-template-columns:24px 1fr auto auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .idx{font-size:12px;color:var(--muted);font-weight:600}
.q input{border:1px solid transparent;border-radius:8px;padding:7px 8px;background:transparent;width:100%;outline:none}
.q input:hover{border-color:var(--line-2)}
.q input:focus{border-color:var(--accent);background:var(--surface)}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--grey-bg);color:var(--ink)}
.add-q{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:var(--accent);font-weight:600;font-size:13px}
.pref{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.pref:first-of-type{border-top:0}
.switch{width:36px;height:20px;border-radius:999px;background:var(--line-2);position:relative;transition:.15s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--ink)} .switch.on::after{left:18px}

/* availability (scheduler) */
.av{max-width:1080px;margin:40px auto 80px;padding:0 24px}
.sched{display:grid;grid-template-columns:280px 1fr 260px;min-height:470px;overflow:hidden}
.sched>div{padding:24px}
.sched .s-info{border-right:1px solid var(--line)}
.sched .s-times{border-left:1px solid var(--line);display:flex;flex-direction:column}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-2);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.avatar.sm{width:32px;height:32px;font-size:12px}
.info-line{display:flex;align-items:flex-start;gap:10px;color:var(--ink-2);margin-top:12px;font-size:13.5px}
.info-line svg{margin-top:2px;color:var(--muted)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-h h3{font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dow{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;padding-bottom:6px}
.day{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:500;position:relative;font-size:14px;max-width:46px;margin:0 auto;width:100%}
.day.off{color:#C4C6CB;cursor:default}
.day.has{background:var(--accent-2);color:var(--accent-ink);font-weight:700}
.day.can:hover{background:#E4E7FF}
.day.sel{background:var(--accent);color:#fff}
.day.today::after{content:"";position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:currentColor}
.times{display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:340px;padding-right:4px}
.time{height:42px;border-radius:9px;border:1px solid var(--line-2);font-weight:600;color:var(--ink-2);transition:.12s;display:flex;align-items:center;justify-content:center;gap:6px}
.time:hover{border-color:var(--accent);color:var(--accent)}
.time.on{background:var(--accent);border-color:var(--accent);color:#fff}
.time.booked{background:var(--grey-bg);border-color:var(--grey-bg);color:var(--muted);cursor:default;text-decoration:line-through}
.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.settings .card{padding:16px}
.settings h4{margin:0 0 4px;font-size:13px}
.settings p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.booked-ok{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;gap:8px}
.booked-ok .tick{width:44px;height:44px;border-radius:50%;background:var(--green-bg);display:grid;place-items:center}
.booked-ok .tick svg{stroke:var(--green);width:22px;height:22px}

/* simple availability */
.av-simple{max-width:660px;margin:40px auto 80px;padding:0 24px}
.av-card{padding:4px 24px}
.av-sec{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.av-sec>label{font-weight:600}
.av-sec>div{justify-self:start}
.dchips{display:flex;gap:6px;flex-wrap:wrap}
.dchip{min-width:52px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);font-weight:600;font-size:13px;color:var(--ink-2);background:var(--surface);transition:.12s}
.dchip:hover{border-color:var(--ink)}
.dchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.av-sel{height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-weight:600;cursor:pointer;outline:none}
.av-sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.av-sum{padding:20px 0}
.av-sum b{display:block;font-size:17px;letter-spacing:-.01em}
.av-sum>span{font-size:13px}
.schips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.schip{padding:6px 12px;border-radius:999px;background:var(--accent-2);color:var(--accent-ink);font-size:13px;font-weight:600}
.av-note{display:flex;gap:10px;color:var(--muted);font-size:13px;margin-top:16px}
.av-note svg{margin-top:2px}
.cday{padding:18px 0 4px;border-top:1px solid var(--line);margin-top:14px}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
@media (max-width:640px){ .av-sec{grid-template-columns:1fr;gap:10px} .av-simple{padding:0 16px} }

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--surface);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .logo{padding:4px 8px 20px}
.nav-i{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--ink-2);font-weight:500}
.nav-i:hover{background:var(--grey-bg)}
.nav-i.on{background:var(--grey-bg);color:var(--ink);font-weight:600}
.nav-i .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
.main{padding:28px 32px 48px;min-width:0}
.d-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;gap:16px}
.d-head h1{font-size:26px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.metric{padding:18px}
.metric .l{font-size:12.5px;color:var(--muted);font-weight:500}
.metric .v{font-size:28px;font-weight:700;letter-spacing:-.03em;margin-top:4px;transition:.3s}
.metric .s{font-size:12px;margin-top:2px}
.metric .v.bump{color:var(--green)}
.up{color:var(--green);font-weight:600}
.d-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.panel{padding:20px}
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-h h3{font-size:16px}
.slot{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:14px;padding:14px 10px;border-radius:10px;border:1px solid transparent;transition:background .3s,border-color .3s}
.slot+.slot{margin-top:4px}
.slot .t{font-weight:700}
.slot .t small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who span.avatar{display:grid;font-size:12px;color:var(--accent-ink)}
.who div>span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:999px;background:var(--grey-bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .5s}
.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:#FFF7E6}100%{background:transparent}}
.pulse::before{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.week{display:grid;grid-template-columns:64px repeat(5,1fr);gap:6px;margin-top:4px}
.week .wh{font-size:12px;color:var(--muted);font-weight:600;text-align:center;padding-bottom:4px}
.week .wh.today{color:var(--accent)}
.week .wt{font-size:12px;color:var(--muted);display:flex;align-items:center;font-weight:600}
.wc{height:52px;border-radius:9px;padding:7px 9px;font-size:12px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;transition:.3s;border:1px solid transparent}
.wc b,.wc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc b{font-weight:600;font-size:12.5px}
.wc.attended{background:var(--grey-bg);color:var(--ink-2)}
.wc.noshow{background:var(--red-bg);color:var(--red)}
.wc.confirmed{background:var(--green-bg);color:var(--green)}
.wc.atrisk{background:var(--amber-bg);color:var(--amber)}
.wc.booked{background:var(--surface);border-color:var(--line-2);color:var(--ink-2)}
.wc.released{background:var(--red-bg);color:var(--red)}
.wc.offer{background:var(--violet-bg);color:var(--violet)}
.wc.freed{background:repeating-linear-gradient(45deg,#F4F4F2,#F4F4F2 6px,#FAFAF9 6px,#FAFAF9 12px);color:var(--muted);border-color:var(--line)}
.wc.today{outline:2px solid var(--accent-2);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.demo{padding:18px;border:1.5px dashed #C7C9F9;background:linear-gradient(180deg,#FBFBFF,#fff)}
.demo h3{font-size:14px;display:flex;align-items:center;gap:8px}
.demo p{margin:4px 0 12px;font-size:12.5px;color:var(--muted)}
.demo .btn{width:100%;justify-content:center;margin-top:8px}
.feed{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
.fi{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 0;animation:fin .35s ease}
@keyframes fin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fi .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.fi .ic svg{width:14px;height:14px}
.fi p{margin:0;font-size:13px;line-height:1.4}
.fi small{color:var(--muted);font-size:11.5px}
.wl{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 8px;border-radius:10px;transition:.3s}
.wl+.wl{border-top:1px solid var(--line)}
.wl span.avatar{color:var(--accent-ink);font-size:12px}
.wl .rk{font-size:12px;font-weight:700;color:var(--muted)}
.wl b{font-weight:600;display:block}
.wl span{font-size:12px;color:var(--muted)}
.wl .score{font-weight:700;font-size:13px;text-align:right}
.wl .score small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.wl.hl{background:var(--violet-bg)}
.wl.gone{opacity:0;transform:translateX(20px)}
.side-stack{display:flex;flex-direction:column;gap:16px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);padding:16px 20px;gap:16px}
.strip div{display:flex;flex-direction:column}
.strip b{font-size:22px;letter-spacing:-.02em;transition:color .3s}
.strip b.bump{color:var(--green)}
.strip span{font-size:12.5px;color:var(--muted)}
.strip em{font-style:normal}
.demo-fab{position:fixed;right:24px;bottom:24px;z-index:15;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.demo-toggle{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(79,70,229,.3);order:2}
.demo-toggle svg{stroke:#fff}
.demo-body{display:none;width:270px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.12);order:1}
.demo-fab.open .demo-body{display:flex;flex-direction:column;gap:8px}
.demo-body p{margin:0 0 4px;font-size:12.5px;color:var(--muted)}
.demo-body .btn{justify-content:center}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,17,21,.25);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:.25s ease;z-index:21;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dr-b{padding:20px 24px;overflow:auto;flex:1}
.dr-sec{margin-bottom:22px}
.dr-sec h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.big{font-size:34px;font-weight:700;letter-spacing:-.03em}
.brk{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:10px;font-size:13px;margin-bottom:8px}
.factor{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:6px;margin:0 6px 6px 0}
.factor.plus{background:var(--green-bg);color:var(--green)}
.factor.minus{background:var(--red-bg);color:var(--red)}
.ai-sum{padding:14px;border-radius:10px;background:var(--accent-2);color:var(--accent-ink);font-size:13.5px}
.qa{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.qa b{display:block;font-weight:600;margin-bottom:2px}
.qa span{color:var(--ink-2)}
.sms{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--grey-bg);border-radius:12px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.4}
.bub.out{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bub.in{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bub small{display:block;font-size:10.5px;opacity:.6;margin-top:2px}
.dr-f{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:8px}
.dr-f .btn{flex:1;justify-content:center}

/* toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:10px;transition:.25s;z-index:40;box-shadow:0 12px 32px rgba(0,0,0,.2)}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast svg{stroke:#4ADE80}

@media (max-width:980px){
  .hero{grid-template-columns:1fr;padding-top:32px}
  .hero h1{font-size:40px}
  .steps,.stats,.metrics,.settings{grid-template-columns:1fr 1fr}
  .rv{grid-template-columns:1fr}
  .rv-side{position:static}
  .sched{grid-template-columns:1fr}
  .sched .s-info,.sched .s-times{border:0;border-top:1px solid var(--line)}
  .dash{grid-template-columns:1fr}
  .side{display:none}
  .d-grid{grid-template-columns:1fr}
  .nav-links{display:none}
  .slot{grid-template-columns:64px 1fr auto}
  .slot .ps,.slot .chev{display:none}
}
@media (max-width:640px){
  .main,.ob-wrap,.rv,.av{padding-left:16px;padding-right:16px}
  .steps,.stats,.metrics,.settings,.grid-2{grid-template-columns:1fr}
  .stepper .st span{display:none}
  .cta-band{flex-direction:column;align-items:flex-start;margin:40px 16px 0}
  .week{grid-template-columns:44px repeat(5,minmax(0,1fr))}
  .wc b{font-size:11px}
  .hv-toast{right:8px}
}

function analyzeJD(text, title, location){
  const t = text.toLowerCase();
  const payM = text.match(/\$\s?\d+(?:\.\d+)?\s?(?:[-–]|to)\s?\$?\s?\d+(?:\.\d+)?(?:\s?\/\s?(?:hr|hour))?|\$\s?\d+(?:\.\d+)?\s?\/\s?(?:hr|hour)/i);

  let shifts = shiftNames.filter(([k]) => t.includes(k)).map(([,v]) => v);
  if (!shifts.length) shifts = ['Morning','Afternoon','Evening','Weekends'];
  const tasks = [];
  if (/cashier|register|order/.test(t)) tasks.push('Cashier');
  if (/drive[- ]?thru|drive[- ]?through/.test(t)) tasks.push('Drive-thru');
  if (/kitchen|prepare|cook|food prep/.test(t)) tasks.push('Kitchen');
  if (/deliver/.test(t)) tasks.push('Delivery');
  if (!tasks.length) tasks.push('Crew');
  const exp = /no experience|we train/.test(t) ? 'Not required (training provided)' : 'Preferred';
  const type = /full[- ]?time/.test(t) && /part[- ]?time/.test(t) ? 'Part-time & full-time' : /full[- ]?time/.test(t) ? 'Full-time' : 'Part-time';
  const minAge = /18 or older|18\+|at least 18/.test(t) ? 18 : 16;
  const needsLicense = /driver'?s license|licen[cs]e/.test(t);

    summary: { role: title || 'Crew Member', location: location || '—', pay: payM ? payM[0].replace(/\s+/g,'') : 'Not stated', shifts, tasks, exp, type },
    compliance: [
      { from: 'How old are you?', to: `Are you ${minAge} or older?`, why: 'We only check the legal minimum age.' },
    ],
    knockout: [
      { q: `Are you ${minAge} or older?`, type: 'Yes / No', req: true },

      { q: `Which shifts can you work? (${shifts.join(', ')})`, type: 'Multi-select', req: true },
      { q: 'When could you start?', type: 'Date', req: false },
      ...(tasks.includes('Drive-thru') || tasks.includes('Cashier') ? [{ q: `Are you comfortable working the ${tasks.filter(x=>x!=='Kitchen').join(' and ').toLowerCase()}?`, type: 'Yes / No', req: false }] : []),

      { q: 'Tell me about a time you helped a customer or worked as part of a team.', s: 'Experience' },
      { q: 'A customer says their order is wrong and they are upset. What do you do?', s: 'Customer care' },
      { q: 'How many hours a week are you looking for?', s: 'Availability' },
    ],
    prefs: [

      { k: 'Store location', d: 'Nearby stores in the same franchise, ranked', on: true },
      { k: 'Job type', d: tasks.concat('Any').join(' · '), on: true },
    ],
  };
}

  }).join('');
  return `<div class="ob-top">${logo}<div class="stepper">${st}</div><a class="btn btn-ghost btn-sm" href="#/dashboard">Skip to dashboard</a></div>`;
}

function canGen(){ return (S.job.mode === 'write' && S.job.jd.trim().length > 20) || (S.job.mode === 'upload' && S.job.file); }
after.job = () => {
  const jd = document.getElementById('jd');

function useFile(file){
  if (!file) return;

  if (/\.txt$/i.test(file.name)) { file.text().then(t => { S.job.jd = t; render(); }); }
  else { if (!S.job.jd.trim()) S.job.jd = SAMPLE_JD; render(); }
}
function generate(){
  const card = document.getElementById('jobcard');

}

/* ================= 4. AVAILABILITY (scheduler) ================= */
const fmtLong = d => d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
const toMin = t => { const [hm, ap] = t.split(' '); let [h, m] = hm.split(':').map(Number); if (ap === 'PM' && h !== 12) h += 12; if (ap === 'AM' && h === 12) h = 0; return h * 60 + m; };
const toLabel = m => { const h = Math.floor(m / 60), mm = m % 60, ap = h >= 12 ? 'PM' : 'AM', hh = ((h + 11) % 12) + 1; return `${hh}:${String(mm).padStart(2,'0')} ${ap}`; };
const HOURS = Array.from({ length: 31 }, (_, i) => toLabel(7 * 60 + i * 30)); // 7:00 AM – 10:00 PM
const DOW = [['Mon',1],['Tue',2],['Wed',3],['Thu',4],['Fri',5],['Sat',6],['Sun',0]];
const BOOKED = { '2026-11-12': new Set(['2:00 PM']) };
function daySlots(){ const a = S.av, out = []; for (let m = toMin(a.from); m + a.slotLen <= toMin(a.to); m += a.slotLen) out.push(toLabel(m)); return out; }
function bookableDays(){ const out = []; for (let n = 1; n <= 2; n++) { const d = new Date(2026, 10, 11 + n); if (S.av.days.has(d.getDay())) out.push(d); } return out; }
const fmtShort = d => d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });

function availability(){
  const a = S.av, isC = a.tab === 'candidate', slots = daySlots();
  const footer = `<div class="ob-foot"><a class="btn btn-ghost" href="#/review">${ic('back')} Back</a>
      <button class="btn btn-primary" data-a="golive">Save & go live ${ic('arrow')}</button></div>`;

  if (isC) {
    const days = bookableDays();
    let body;
    if (a.cBooked) {
      const [k, t] = a.cSel.split('|');
      body = `<div class="booked-ok" style="padding:32px 0"><span class="tick">${ic('check')}</span><b style="font-size:16px">You're booked!</b>
        <div class="muted">${fmtLong(fromKey(k))} at ${t}</div><div class="muted" style="font-size:13px">We'll text you the address and a reminder the day before.</div>
        <button class="btn btn-ghost btn-sm" style="margin-top:8px" data-a="crestart">Start over</button></div>`;
    } else if (!days.length || !slots.length) {
      body = `<p class="muted" style="padding:24px 0">No open times in the next 2 days. Go back and add more days or hours.</p>`;
    } else {
      body = days.map(d => { const k = key(d); return `<div class="cday"><b>${fmtShort(d)}</b><div class="slot-grid">${slots.map(t => {
          const b = BOOKED[k] && BOOKED[k].has(t), id = k + '|' + t;
          return `<button class="time ${b ? 'booked' : a.cSel === id ? 'on' : ''}" ${b ? 'disabled' : `data-a="ctime" data-t="${id}"`}>${t}</button>`; }).join('')}</div></div>`; }).join('')
        + `<button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:18px" data-a="cbook" ${a.cSel ? '' : 'disabled'}>Book interview</button>`;
    }
    return `${obTop(3)}
    <div class="av-simple">
      <div class="row between" style="align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px">
        <div class="ob-head"><h1>What candidates see</h1><p style="margin:0">Only the next 2 days are offered, so people come while they're still interested.</p></div>
        <button class="btn btn-ghost btn-sm" data-a="avtab" data-v="hirer">${ic('back')} My times</button>
      </div>
      <div class="card av-card" style="padding:24px">
        <h3 style="font-size:18px">${esc(S.job.title || 'Crew Member')} interview</h3>
        <div class="row muted" style="gap:16px;margin:6px 0 4px;font-size:13px;flex-wrap:wrap"><span class="row" style="gap:6px">${ic('pin')}Store #214 · 1200 Main St</span><span class="row" style="gap:6px">${ic('clock')}${a.slotLen} min</span></div>
        ${body}
      </div>
      ${footer}
    </div>`;
  }

  const perWeek = slots.length * a.days.size;
  const dayNames = DOW.filter(([, i]) => a.days.has(i)).map(([n]) => n);
  const sum = !a.days.size ? '<b>Pick at least one day</b>'
    : !slots.length ? '<b>Pick an end time after the start time</b>'
    : `<b>${perWeek} interviews a week</b><span class="muted">${slots.length} a day · ${dayNames.length === 5 && !a.days.has(0) && !a.days.has(6) ? 'Weekdays' : dayNames.join(', ')}</span>
       <div class="schips">${slots.map(t => `<span class="schip">${t}</span>`).join('')}</div>`;
  const opts = sel => HOURS.map(t => `<option ${t === sel ? 'selected' : ''}>${t}</option>`).join('');

  return `${obTop(3)}
  <div class="av-simple">
    <div class="ob-head"><h1>When can you interview?</h1><p>Set it once. We repeat it every week.</p></div>
    <div class="card av-card">
      <div class="av-sec"><label>Days</label>
        <div class="dchips">${DOW.map(([n, i]) => `<button class="dchip ${a.days.has(i) ? 'on' : ''}" data-a="avday" data-v="${i}">${n}</button>`).join('')}</div></div>
      <div class="av-sec"><label>Time</label>
        <div class="row" style="gap:10px"><select class="av-sel" id="avfrom" aria-label="From">${opts(a.from)}</select><span class="muted">to</span><select class="av-sel" id="avto" aria-label="To">${opts(a.to)}</select></div></div>
      <div class="av-sec"><label>Each interview</label>
        <div class="seg">${[15,20,30].map(n => `<button class="${a.slotLen === n ? 'on' : ''}" data-a="len" data-v="${n}">${n} min</button>`).join('')}</div></div>
      <div class="av-sum">${sum}</div>
    </div>
    <div class="av-note">${ic('pin')}<span>Interviews at ${esc(S.job.location)}. Candidates are told to ask for Maria, and get reminders automatically.</span></div>
    <div style="margin-top:10px"><button class="link" style="font-size:13px" data-a="avtab" data-v="candidate">Preview what candidates see →</button></div>
    ${footer}
  </div>`;
}

      <div class="demo-body">
        <p>Play out what happens on its own when a slot is in trouble.</p>
        <button class="btn btn-accent btn-sm" data-a="sim1" id="sim1" ${D.sim1 || D.running ? 'disabled style="opacity:.5"' : ''}>${ic('phone')} Jordan doesn't reply</button>
        <button class="btn btn-ghost btn-sm" data-a="sim2" id="sim2" ${D.sim2 || D.running ? 'disabled style="opacity:.5"' : ''}>${ic('clock')} Friday slot can't be filled</button>
        <button class="btn btn-sm" data-a="reset" style="color:var(--muted)">${ic('refresh')} Reset</button>
      </div>
    </div>
  </div>`;
}

/* ---- simulations ---- */
const wait = ms => new Promise(r => setTimeout(r, ms));
function pushFeed(f){ D.feed.unshift(f); const el = document.getElementById('feed'); if (el) el.innerHTML = feedHtml(); }
function redrawToday(flashId){
  document.getElementById('today').innerHTML = D.today.map(slotRow).join('');
  const sl = document.getElementById('statusline'); if (sl) sl.innerHTML = statusLine();
  document.getElementById('weekwrap').innerHTML = weekGrid();
  if (flashId) document.getElementById(flashId)?.classList.add('flash');
}
function bump(id, val){ const el = document.getElementById(id); if (!el) return; el.textContent = val; el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 1500); }
function lockDemo(on){ D.running = on; ['sim1','sim2'].forEach(id => { const b = document.getElementById(id); if (b) { const done = D[id]; b.disabled = on || done; b.style.opacity = (on || done) ? .5 : 1; } }); }

async function sim1(){
  if (D.sim1 || D.running) return; lockDemo(true);
  const s = D.today[1];
  s.st = 'calling'; s.note = 'Calling to check if they\'re coming'; redrawToday('t2');
  pushFeed({ k:'amber', i:'phone', t:'Calling <b>Jordan Lee</b> to check about 2:30 PM.', w:'Just now' });
  await wait(1800);
  s.st = 'released'; s.note = 'Can\'t come today. Moved to next week.'; redrawToday('t2');
  C.jordan.sms.push(['out','Call: checked if Jordan can come at 2:30 PM today.','Today'],['in','Can\'t come today.','Today'],['out','No problem. You don\'t need to apply again. We\'ll send you next week\'s times.','Today']);
  pushFeed({ k:'red', i:'x', t:'<b>Jordan Lee</b> can\'t come at 2:30 PM. We moved them to next week.', w:'Just now' });
  await wait(1400);
  const top = document.getElementById('wl-priya'); top && top.classList.add('hl');
  s.c = 'priya'; s.st = 'offer'; s.note = 'Offered to Priya from the waiting list'; redrawToday('t2');
  C.priya.sms.push(['out','A 2:30 PM interview opened today at Store #214. Tap to take it.','Today']);
  pushFeed({ k:'violet', i:'msg', t:'Offered 2:30 PM to <b>Priya Shah</b>, the best fit on the waiting list.', w:'Just now' });
  await wait(2000);
  C.priya.sms.push(['in','Yes, I\'ll take it.','Today']);
  s.st = 'confirmed'; s.note = 'Took the slot from the waiting list'; redrawToday('t2');
  D.wait = D.wait.filter(x => x !== 'priya');
  const wl = document.getElementById('wl-priya'); if (wl) { wl.classList.add('gone'); await wait(300); }
  document.getElementById('wait').innerHTML = waitHtml();
  const cnt = document.getElementById('wlcnt'); if (cnt) cnt.textContent = D.wait.length + ' people';
  pushFeed({ k:'green', i:'check', t:'<b>Priya Shah</b> is coming at 2:30 PM.', w:'Just now' });
  D.m.backfilled++; D.m.used++; bump('m-bf', D.m.backfilled); bump('m-used', D.m.used + '/10');
  D.sim1 = true; lockDemo(false);
  toast('2:30 PM is filled again. Priya Shah is coming.');
}
async function sim2(){
  if (D.sim2 || D.running) return; lockDemo(true);
  const s = D.week.Fri[1], cell = () => document.getElementById('w-Fri-1');
  s.st = 'released'; document.getElementById('weekwrap').innerHTML = weekGrid(); cell()?.classList.add('flash');
  pushFeed({ k:'red', i:'x', t:'<b>Ava Wright</b> cancelled Fri 2:30 PM.', w:'Just now' });
  await wait(1500);
  s.st = 'offer'; document.getElementById('weekwrap').innerHTML = weekGrid();
  pushFeed({ k:'violet', i:'msg', t:'Offered Fri 2:30 PM to the waiting list. No one could take it.', w:'Just now' });
  await wait(1800);
  s.st = 'freed'; document.getElementById('weekwrap').innerHTML = weekGrid(); cell()?.classList.add('flash');
  pushFeed({ k:'grey', i:'clock', t:'No one could take Fri 2:30 PM, so we told you 2 hours ahead. That time is yours again.', w:'Just now' });
  D.m.back = 0.5; bump('m-back', '0.5 hr');
  D.sim2 = true; lockDemo(false);
  toast('Fri 2:30 PM is free time now.');
}

/* ---- candidate drawer ---- */
function openDrawer(id){
  const c = C[id]; if (!c) return;
  const dr = document.getElementById('drawer');
  const slot = D.today.find(s => s.c === id);
  const inWait = D.wait.includes(id);
  const status = slot ? STATUS[slot.st] : inWait ? ['Waitlisted','p-amber'] : null;
  if (!c.fit) {
    dr.innerHTML = `<div class="dr-h"><span class="avatar">${c.i}</span><div style="flex:1"><b style="font-size:16px">${c.n}</b><div class="muted" style="font-size:12.5px">${esc(S.job.title || 'Crew Member')} applicant</div></div><button class="icon-btn" data-a="close">${ic('x')}</button></div>
      <div class="dr-b"><div class="muted">Details are shown for today's interviews and the waiting list in this prototype.</div></div>`;
  } else {
    dr.innerHTML = `
    <div class="dr-h"><span class="avatar">${c.i}</span><div style="flex:1"><b style="font-size:16px">${c.n}</b><div class="muted" style="font-size:12.5px">${esc(S.job.title || 'Crew Member')} applicant</div></div>
      ${status ? `<span class="pill ${status[1]}">${status[0]}</span>` : ''}<button class="icon-btn" data-a="close">${ic('x')}</button></div>
    <div class="dr-b">
      <div class="dr-sec"><h4>Passed screening</h4>
        <div class="qa"><b>Can work</b><span>${c.prefs[0]}</span></div>
        <div class="qa"><b>Wants to work as</b><span>${c.prefs[2] === 'Any' ? 'Any role' : c.prefs[2]}</span></div>
        <div class="qa"><b>Gets to the store by</b><span>${c.commute}</span></div>
      </div>
      ${c.sms ? `<div class="dr-sec"><h4>Messages</h4><div class="sms">${c.sms.map(([d,t,w])=>`<div class="bub ${d}">${esc(t)}<small>${w}</small></div>`).join('')}</div></div>` : ''}
    </div>
    <div class="dr-f">${slot ? `<button class="btn btn-ghost btn-sm" data-a="outcome" data-v="No-show">No-show</button><button class="btn btn-ghost btn-sm" data-a="outcome" data-v="Not a fit">Not a fit</button><button class="btn btn-primary btn-sm" data-a="outcome" data-v="Hired">Hire</button>`
      : `<button class="btn btn-primary btn-sm" data-a="invite">Invite to an interview</button>`}</div>`;
  }
  dr.classList.add('on'); document.getElementById('scrim').classList.add('on');
}
function closeDrawer(){ document.getElementById('drawer').classList.remove('on'); document.getElementById('scrim').classList.remove('on'); }
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* ---------------- actions ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  const A = {
    sample: () => { S.job.jd = SAMPLE_JD; render(); },
    tpl: () => { S.job.jd = TEMPLATES[v]; S.job.title = v; render(); },
    mode: () => { S.job.mode = v; render(); },
    rmfile: () => { S.job.file = null; render(); },
    generate: () => generate(),
    editjd: () => go('job'),
    delq: () => { S.gen[el.dataset.k].splice(+el.dataset.i, 1); render(); },
    addq: () => { const k = el.dataset.k; S.gen[k].push(k === 'knockout' ? { q:'New question', type:'Yes / No', req:false } : { q:'New question', s:'Custom' }); render(); setTimeout(() => { const ins = document.querySelectorAll(`.q input[data-k="${k}"]`); const last = ins[ins.length-1]; last && (last.focus(), last.select()); }, 0); },
    pref: () => { const p = S.gen.prefs[+el.dataset.i]; p.on = !p.on; el.classList.toggle('on', p.on); },
    saveqs: () => { S.savedQs = true; toast('Screening saved'); go('availability'); },
    avtab: () => { S.av.tab = v; render(); },
    avday: () => { const d = +v; S.av.days.has(d) ? S.av.days.delete(d) : S.av.days.add(d); S.av.cSel = null; render(); },
    len: () => { S.av.slotLen = +v; S.av.cSel = null; render(); },
    ctime: () => { S.av.cSel = el.dataset.t; render(); },
    cbook: () => { S.av.cBooked = true; render(); },
    crestart: () => { S.av.cBooked = false; S.av.cSel = null; render(); },
    golive: () => { go('dashboard'); setTimeout(() => toast(`${S.job.title || 'Crew Member'} is live. Apply link is ready to share.`), 150); },
    open: () => openDrawer(el.dataset.c),
    close: () => closeDrawer(),
    outcome: () => { closeDrawer(); toast(v === 'Hired' ? 'Offer SMS sent. Nice hire!' : v === 'No-show' ? 'Marked as no-show. 30-day cooldown applied.' : 'Marked as not a fit. Candidate gets a polite SMS.'); },
    invite: () => { closeDrawer(); toast('Invite sent with the next open slots.'); },
    sim1: () => sim1(),
    sim2: () => sim2(),
    reset: () => { if (D.running) return; Object.assign(C.jordan, { sms: C.jordan.sms.slice(0,1) }); C.priya.sms = C.priya.sms.slice(0,1); resetDash(); render(); },
    copylink: () => toast('Apply link copied: slotguard.app/apply/214'),
    soon: () => toast('Not part of this prototype'),
    demotoggle: () => { D.demoOpen = !D.demoOpen; document.getElementById('demofab').classList.toggle('open', D.demoOpen); },
  };
  if (A[a]) { e.preventDefault(); A[a](); }
});

render();
// test hooks (used only for automated checks): ?cand opens the candidate preview, ?autodemo plays both demos
if (location.search.includes('cand')) { S.av.tab = 'candidate'; render(); }
if (location.search.includes('autodemo')) setTimeout(async () => { await sim1(); await sim2(); }, 300);
</script>
</body>
</html>
