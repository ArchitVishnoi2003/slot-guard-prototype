<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slotwise</title>
<meta name="description" content="Slotwise: every interview slot, filled wisely. Interview scheduling for high-volume hourly hiring.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --ink:#0F1115; --ink-2:#3F4450; --muted:#6F7480; --line:#ECECEA; --line-2:#E0E0DD;
  --accent:#4F46E5; --accent-2:#EEF0FF; --accent-ink:#3730A3;
  --green:#15803D; --green-bg:#EAF7EF; --amber:#B45309; --amber-bg:#FDF4E7; --red:#C2410C; --red-bg:#FDEEE8;
  --violet:#6D28D9; --violet-bg:#F3EEFF; --grey-bg:#F1F1EF;
  --r:14px; --shadow:0 1px 2px rgba(16,17,21,.04),0 4px 16px rgba(16,17,21,.04);
  --bar:40px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{letter-spacing:-.02em;margin:0}
p{margin:0}
.svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:11px;font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#262A33}
.btn-primary:disabled{background:#C9CBD0;cursor:not-allowed}
.btn-ghost{border:1px solid var(--line-2);background:var(--surface)}
.btn-ghost:hover{background:#F4F4F2}
.btn-sm{height:34px;padding:0 13px;font-size:13px;border-radius:9px}
.link{color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}

/* pills and tags */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.p-green{background:var(--green-bg);color:var(--green)}
.p-amber{background:var(--amber-bg);color:var(--amber)}
.p-red{background:var(--red-bg);color:var(--red)}
.p-violet{background:var(--violet-bg);color:var(--violet)}
.p-grey{background:var(--grey-bg);color:var(--muted)}
.pulse::before{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.2}}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:7px;background:var(--grey-bg);color:var(--ink-2);font-size:12.5px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-2);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo-mark svg{width:17px;height:17px;stroke:#fff;stroke-width:2.2}

/* ---------- prototype bar ---------- */
#pbar{position:sticky;top:0;z-index:40;height:var(--bar);background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:13px}
#pbar .tagp{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.14);flex:none}
#pbar .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
#pbar .msg.live{opacity:1;font-weight:500}
#pbar button{height:28px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
#pbar button:hover{background:rgba(255,255,255,.2)}
#pbar button.pri{background:#fff;color:var(--ink)}
#pbar button:disabled{opacity:.4;cursor:default}
#pbar svg{width:13px;height:13px}
.short{display:none}

/* ---------- landing ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;max-width:1160px;margin:0 auto;padding:18px 24px;gap:12px}
.nav-links{display:flex;gap:28px;color:var(--ink-2);font-weight:500}
.hero{max-width:1160px;margin:0 auto;padding:44px 24px 24px;display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.problem{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.problem b{background:var(--red-bg);color:var(--red);padding:2px 9px;border-radius:999px;font-size:12px}
.hero h1{font-size:54px;line-height:1.04;letter-spacing:-.035em;margin:16px 0 18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{font-size:18px;color:var(--ink-2);max-width:480px;margin-bottom:28px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.hv{padding:18px 18px 8px}
.hv-h{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px}
.hv-cap{margin-top:12px;text-align:center;font-size:13px;color:var(--muted);min-height:20px;transition:opacity .3s}
.section{max-width:1160px;margin:0 auto;padding:64px 24px 24px}
.eyebrow{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.section h2{font-size:32px;margin:8px 0 28px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step{padding:22px}
.step .num{width:32px;height:32px;border-radius:9px;background:var(--accent-2);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;margin-bottom:14px}
.step h3{font-size:16px;margin-bottom:6px}
.step p{color:var(--ink-2);font-size:13.5px}
.cta-band{max-width:1112px;margin:56px auto 0;padding:40px;border-radius:20px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:24px}
.cta-band h2{font-size:28px}
.cta-band .btn-primary{background:#fff;color:var(--ink)}
footer.foot{max-width:1160px;margin:0 auto;padding:32px 24px 40px;color:var(--muted);font-size:13px}

/* ---------- interview rows (shared by landing + dashboard) ---------- */
.slot{display:grid;grid-template-columns:76px minmax(0,1fr) auto;grid-template-areas:"t who st";align-items:center;column-gap:14px;row-gap:8px;padding:14px 8px;border-radius:12px;transition:background .4s}
.slot+.slot{border-top:1px solid var(--line)}
.slot .t{grid-area:t;font-weight:700;white-space:nowrap}
.slot .t small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.slot .who{grid-area:who;display:flex;align-items:center;gap:12px;min-width:0}
.slot .who b{display:block;font-weight:600}
.slot .who span.note{display:block;font-size:13px;color:var(--muted)}
.slot .st{grid-area:st;display:flex;gap:6px;justify-content:flex-end}
.flash{animation:flash 1.4s ease}
@keyframes flash{0%{background:#FFF5DF}100%{background:transparent}}

/* ---------- setup (onboarding) ---------- */
.ob-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:var(--bar);z-index:20}
.stepper{display:flex;align-items:center;gap:10px}
.st-i{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.st-i .c{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:700}
.st-i.on{color:var(--ink)} .st-i.on .c{border-color:var(--ink);background:var(--ink);color:#fff}
.st-i.done .c{border-color:var(--green);background:var(--green);color:#fff}
.st-i.done .c svg{width:12px;height:12px;stroke:#fff}
.st-line{width:26px;height:1.5px;background:var(--line-2)}
.step-mini{display:none;font-size:13px;font-weight:600;color:var(--ink-2)}
.wrapc{max-width:760px;margin:36px auto 80px;padding:0 24px}
.head h1{font-size:28px;margin-bottom:6px}
.head p{color:var(--ink-2);margin-bottom:24px}
.foot-btns{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px}

/* step 1: roles */
.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.role{text-align:left;padding:16px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--surface);display:flex;gap:14px;align-items:center;transition:.15s;width:100%}
.role:hover{border-color:#B9BCF7}
.role.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.role .ri{width:44px;height:44px;border-radius:12px;background:var(--grey-bg);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.role .ri svg{width:20px;height:20px}
.role.on .ri{background:var(--accent-2);color:var(--accent)}
.role .rt b{display:block;font-size:15px;color:var(--ink)}
.role .rt span{font-size:13px;color:var(--muted)}
.role .tick{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.role.on .tick{background:var(--accent);border-color:var(--accent)}
.role .tick svg{width:12px;height:12px;stroke:#fff}
.field{display:flex;flex-direction:column;gap:6px;margin-top:20px}
.field label{font-size:13px;font-weight:600}
.input,.textarea{width:100%;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);padding:11px 13px;outline:none;transition:.15s}
.input:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.textarea{min-height:200px;resize:vertical;line-height:1.55}
.subtle-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.subtle-btn:hover{color:var(--accent)}
.gen{padding:44px 24px;text-align:center}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--accent-2);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-steps{text-align:left;max-width:320px;margin:20px auto 0;display:flex;flex-direction:column;gap:10px}
.gen-step{display:flex;align-items:center;gap:10px;color:var(--muted)}
.gen-step .b{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.gen-step.done{color:var(--ink)} .gen-step.done .b{background:var(--green);border-color:var(--green)}
.gen-step .b svg{width:12px;height:12px;stroke:#fff}

/* step 2: questions */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-10px 0 18px}
.notice{display:flex;gap:10px;padding:13px 15px;border-radius:12px;background:var(--accent-2);color:var(--accent-ink);margin-bottom:16px;font-size:13.5px}
.notice svg{margin-top:2px}
.qcard{padding:20px;margin-bottom:14px}
.qcard-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.qcard-h h3{font-size:16px}
.qcard-h p{margin-top:2px;color:var(--muted);font-size:13px}
.q{display:grid;grid-template-columns:22px minmax(0,1fr) 32px;align-items:start;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .idx{font-size:12px;color:var(--muted);font-weight:600;padding-top:10px}
.q textarea{border:1px solid transparent;border-radius:8px;padding:8px;background:transparent;width:100%;outline:none;resize:none;overflow:hidden;line-height:1.45;display:block}
.q textarea:hover{border-color:var(--line-2)}
.q textarea:focus{border-color:var(--accent);background:var(--surface)}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:.15s}
.icon-btn:hover{background:var(--grey-bg);color:var(--ink)}
.q .icon-btn{opacity:0;margin-top:3px}
.q:hover .icon-btn,.q:focus-within .icon-btn{opacity:1}
@media (hover:none){ .q .icon-btn{opacity:1} }
.add-q{display:inline-flex;align-items:center;gap:6px;margin-top:6px;color:var(--accent);font-weight:600;font-size:13px}
.fold{display:flex;align-items:center;gap:6px;margin-top:4px;font-weight:600;font-size:13px;color:var(--accent)}
.fold svg{transition:.2s}
.fold.open svg{transform:rotate(90deg)}

/* step 3: interview times */
.av-card{padding:4px 24px}
.av-sec{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.av-sec>label{font-weight:600}
.av-sec>div{justify-self:start;min-width:0}
.dchips{display:flex;gap:6px;flex-wrap:wrap}
.dchip{min-width:50px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);font-weight:600;font-size:13px;color:var(--ink-2);background:var(--surface);transition:.12s}
.dchip:hover{border-color:var(--ink)}
.dchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.av-sel{height:42px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-weight:600;cursor:pointer;outline:none}
.av-sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.seg{display:inline-flex;padding:3px;background:var(--grey-bg);border-radius:10px;gap:2px}
.seg button{height:34px;padding:0 14px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.av-sum{padding:20px 0}
.av-sum b{display:block;font-size:17px;letter-spacing:-.01em}
.av-sum>span{font-size:13px}
.schips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.schip{padding:6px 12px;border-radius:999px;background:var(--accent-2);color:var(--accent-ink);font-size:13px;font-weight:600}
.av-note{display:flex;gap:10px;color:var(--muted);font-size:13px;margin-top:16px}
.av-note svg{margin-top:2px}

/* candidate preview */
.cp{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.cp-card{padding:24px}
.cday{padding:16px 0 4px;border-top:1px solid var(--line);margin-top:16px}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:10px}
.time{height:44px;border-radius:10px;border:1px solid var(--line-2);font-weight:600;color:var(--ink-2);transition:.12s;background:var(--surface)}
.time:hover{border-color:var(--accent);color:var(--accent)}
.time.on{background:var(--accent);border-color:var(--accent);color:#fff}
.time.booked{background:var(--grey-bg);border-color:var(--grey-bg);color:#A3A6AD;cursor:default;text-decoration:line-through}
.ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 0 8px}
.ok .tk{width:46px;height:46px;border-radius:50%;background:var(--green-bg);display:grid;place-items:center;margin-bottom:4px}
.ok .tk svg{stroke:var(--green);width:22px;height:22px}
.phone{border-radius:34px;border:9px solid var(--ink);background:#F2F2F6;padding:14px 12px 20px;box-shadow:0 18px 40px rgba(15,17,21,.12)}
.phone-h{text-align:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.phone-h b{display:block;color:var(--ink);font-size:13px}
.bub{max-width:88%;padding:9px 12px;border-radius:16px;font-size:13px;line-height:1.4;margin-bottom:8px;background:#fff;border-bottom-left-radius:5px}
.bub.me{margin-left:auto;background:var(--accent);color:#fff;border-radius:16px;border-bottom-right-radius:5px;max-width:40%;text-align:center}
.bub small{display:block;font-size:10.5px;opacity:.55;margin-top:3px}
.bub .map{display:block;margin-top:6px;padding:7px;border-radius:9px;background:var(--grey-bg);font-size:12px;font-weight:600;color:var(--accent-ink)}

/* you're live */
.live-hero{text-align:center;margin-bottom:28px}
.live-hero .tk{width:56px;height:56px;border-radius:50%;background:var(--green-bg);display:grid;place-items:center;margin:0 auto 14px}
.live-hero .tk svg{stroke:var(--green);width:26px;height:26px;stroke-width:2.2}
.live-hero h1{font-size:30px;margin-bottom:6px}
.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.live-grid .card{padding:22px}
.live-grid h3{font-size:16px;margin-bottom:4px}
.linkbox{display:flex;gap:8px;margin-top:14px}
.linkbox input{flex:1;min-width:0;height:42px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:var(--grey-bg);font-weight:500;color:var(--ink-2)}
.poster{border:1px dashed var(--line-2);border-radius:12px;padding:18px;text-align:center;margin-top:14px}
.poster .ph{font-size:20px;font-weight:700;letter-spacing:-.02em}
.poster .pr{font-size:13px;color:var(--ink-2);margin:2px 0 12px}
.qr{width:120px;height:120px;margin:0 auto;display:grid;place-items:center}
.qr svg,.qr img{width:120px;height:120px}
.qr-fallback{width:120px;height:120px;border-radius:8px;background:var(--grey-bg);display:grid;place-items:center;color:var(--muted);font-size:12px}
.next{padding:20px 22px;margin-top:16px}
.next ol{margin:10px 0 0;padding-left:20px;color:var(--ink-2)}
.next li{margin-bottom:4px}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - var(--bar))}
.side{border-right:1px solid var(--line);background:var(--surface);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:var(--bar);height:calc(100vh - var(--bar))}
.side .logo{padding:4px 8px 20px}
.nav-i{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:9px;color:var(--ink-2);font-weight:500}
.nav-i:hover{background:var(--grey-bg)}
.nav-i.on{background:var(--grey-bg);color:var(--ink);font-weight:600}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.tabs{display:none}
.main{padding:28px 32px 56px;min-width:0}
.topm{display:none}
.d-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.d-head h1{font-size:26px}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13.5px}
.d-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{padding:20px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.panel-h h3{font-size:16px}
.panel-h p{font-size:13px;color:var(--muted);margin-top:2px}
.mk{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);font-weight:600;font-size:13px;background:var(--surface);white-space:nowrap}
.mk:hover{border-color:var(--ink)}
.mk.yes:hover{border-color:var(--green);color:var(--green)}
.mk.no:hover{border-color:var(--red);color:var(--red)}
.week{display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr));gap:6px;margin-top:6px}
.week .wh{font-size:12px;color:var(--muted);font-weight:600;text-align:center;padding-bottom:4px}
.week .wh.today{color:var(--accent)}
.week .wt{font-size:12px;color:var(--muted);display:flex;align-items:center;font-weight:600}
.wc{height:54px;border-radius:10px;padding:7px 10px;font-size:12px;display:flex;flex-direction:column;justify-content:center;transition:.4s;border:1px solid transparent;min-width:0}
.wc b,.wc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc b{font-weight:600;font-size:12.5px}
.c-attended{background:var(--grey-bg);color:var(--ink-2)}
.c-tomark{background:var(--surface);border:1px dashed var(--line-2);color:var(--muted)}
.c-noshow,.c-released{background:var(--red-bg);color:var(--red)}
.c-confirmed{background:var(--green-bg);color:var(--green)}
.c-atrisk,.c-calling{background:var(--amber-bg);color:var(--amber)}
.c-booked{background:var(--surface);border-color:var(--line-2);color:var(--ink-2)}
.c-offer{background:var(--violet-bg);color:var(--violet)}
.c-freed{background:repeating-linear-gradient(45deg,#F4F4F2,#F4F4F2 6px,#FAFAF9 6px,#FAFAF9 12px);color:var(--muted);border-color:var(--line)}
.wc.today{outline:2px solid var(--accent-2);outline-offset:1px}
.wlist{display:none}
.wday{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.wday:first-child{border-top:0}
.wday .dn{width:52px;flex:none;font-weight:600;font-size:13px;padding-top:4px}
.wday .dn.today{color:var(--accent)}
.wday .ds{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.wday .wi{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.wl{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border-radius:10px;transition:.35s}
.wl+.wl{border-top:1px solid var(--line)}
.wl b{font-weight:600;display:block}
.wl span.n{font-size:12.5px;color:var(--muted);display:block}
.wl.hl{background:var(--violet-bg)}
.wl.gone{opacity:0;transform:translateX(16px)}
.page-h{margin-bottom:22px}
.page-h h1{font-size:26px}
.page-h p{color:var(--ink-2);margin-top:4px}
.job-card{padding:22px}
.job-card .row-l{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}

/* demo caption card (phones only) */
#narr{display:none;position:fixed;left:12px;right:12px;bottom:84px;z-index:35;background:var(--ink);color:#fff;padding:12px 14px;border-radius:14px;font-size:13.5px;line-height:1.45;box-shadow:0 12px 32px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
#narr b{color:#A5B4FC}

/* toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:10px;transition:.25s;z-index:60;box-shadow:0 12px 32px rgba(0,0,0,.2);max-width:calc(100vw - 32px);pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast svg{stroke:#4ADE80}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .hero{grid-template-columns:1fr;gap:36px;padding-top:28px}
  .steps{grid-template-columns:1fr 1fr}
  .nav-links{display:none}
  .d-grid{grid-template-columns:1fr}
  .cp{grid-template-columns:1fr}
  .phone{max-width:320px;margin:0 auto;width:100%}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .topm{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:var(--bar);z-index:20}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:10px}
  .tabs a.on{color:var(--accent)}
  .tabs svg{width:20px;height:20px}
  .main{padding:20px 16px 96px}
  #toast{bottom:84px}
  .week,.legend{display:none}
  .wlist{display:block}
  #pbar .msg.live{display:none}
  #pbar .msg.short{display:inline}
  #narr{display:block}
  #narr.on{opacity:1;transform:none}
  .stepper{display:none}
  .step-mini{display:block}
}
@media (max-width:640px){
  .long{display:none} .short{display:inline}
  #pbar{padding:0 10px;gap:8px}
  .nav{padding:14px 16px}
  .nav .btn-ghost{display:none}
  .hero{padding:24px 16px 8px}
  .hero h1{font-size:38px}
  .hero .lead{font-size:16px}
  .hero-ctas .btn{flex:1 1 auto}
  .section{padding:48px 16px 16px}
  .section h2{font-size:26px}
  .steps{grid-template-columns:1fr}
  .cta-band{flex-direction:column;align-items:flex-start;margin:40px 16px 0;padding:28px}
  .cta-band h2{font-size:23px}
  .slot{grid-template-columns:62px minmax(0,1fr);grid-template-areas:"t who" ". st";padding:14px 4px}
  .slot .st{justify-content:flex-start}
  .ob-top{padding:12px 16px}
  .wrapc{padding:0 16px;margin-top:24px}
  .head h1{font-size:24px}
  .roles{grid-template-columns:1fr}
  .av-card{padding:4px 18px}
  .av-sec{grid-template-columns:1fr;gap:10px}
  .live-grid{grid-template-columns:1fr}
  .foot-btns .btn-primary{flex:1}
  .d-head h1{font-size:23px}
}
@media print{
  body *{visibility:hidden}
  .poster,.poster *{visibility:visible}
  .poster{position:fixed;left:0;top:0;width:100%;border:0;padding:60px}
  .poster .ph{font-size:48px} .poster .pr{font-size:22px}
  .qr,.qr svg{width:320px;height:320px}
}
</style>
</head>
<body>

<div id="app"></div>
<div id="narr" aria-live="polite"></div>

<script>
/* ================= icons ================= */
const I = {
  calcheck:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/>',

  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  msg:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/>',

  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',

const ic = (n, s = '') => `<svg class="svg" viewBox="0 0 24 24" aria-hidden="true" ${s}>${I[n] || ''}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const $ = id => document.getElementById(id);

/* ================= job templates ================= */
const TEMPLATES = {
  crew: { title:'Crew Member', icon:'burger', line:'$15–17/hr · orders, food, cleaning', jd:`Crew Member – Store #214, Austin, TX
Pay: $15–$17/hr + free shift meals

We're looking for friendly, reliable crew members to take orders, prepare food and keep the restaurant clean. No experience needed – we train you.

Shifts: morning, afternoon, evening and weekends. Part-time and full-time available.

Requirements:
- 16 or older

- Comfortable working the cashier and drive-thru

  cashier: { title:'Cashier', icon:'cash', line:'$15–16/hr · counter and drive-thru', jd:`Cashier – Store #214, Austin, TX
Pay: $15–$16/hr

Greet customers, take orders at the counter and drive-thru, handle cash and card payments, and keep the front area clean. No experience needed – we train you.

Shifts: afternoon, evening and weekends. Part-time.

Requirements:

  driver: { title:'Delivery Driver', icon:'car', line:'$14/hr + tips · own car needed', jd:`Delivery Driver – Store #214, Austin, TX

Deliver orders to customers quickly and safely, and help in the store between deliveries.

Shifts: evening and weekends. Part-time and full-time available.

Requirements:

};

/* ================= state ================= */
const DEMO_TODAY = new Date(2026, 10, 11); // Wed, Nov 11 2026
const S = {
  job: { tpl: null, title: '', location: 'Store #214 · 1200 Main St, Austin, TX', jd: '', file: null, showJd: false },
  gen: null, voiceOpen: false, generating: false,
  av: { days: new Set([1, 2, 3, 4, 5]), from: '2:00 PM', to: '3:00 PM', slotLen: 30, tab: 'hirer', cSel: null, cBooked: false },
};
const key = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const jobTitle = () => S.job.title || 'Crew Member';
const APPLY_LINK = 'slotwise.app/apply/214';

/* ================= mock AI: JD → questions ================= */
function analyzeJD(text, title, location){
  const t = text.toLowerCase();
  const payM = text.match(/\$\s?\d+(?:\.\d+)?\s?(?:[-–]|to)\s?\$?\s?\d+(?:\.\d+)?(?:\s?\/\s?(?:hr|hour))?|\$\s?\d+(?:\.\d+)?\s?\/\s?(?:hr|hour)/i);
  const shiftNames = [['morning','Mornings'],['afternoon','Afternoons'],['evening','Evenings'],['night','Overnight'],['weekend','Weekends']];
  let shifts = shiftNames.filter(([k]) => t.includes(k)).map(([, v]) => v);
  if (!shifts.length) shifts = ['Mornings','Afternoons','Evenings','Weekends'];
  const tasks = [];
  if (/cashier|register|counter/.test(t)) tasks.push('cashier');
  if (/drive[- ]?thru|drive[- ]?through/.test(t)) tasks.push('drive-thru');
  const minAge = /18 or older|18\+|at least 18/.test(t) ? 18 : 16;
  const needsLicense = /driver'?s license|licen[cs]e/.test(t);
  return {
    summary: { role: title, pay: payM ? payM[0].replace(/\s+/g, '') : 'Pay not stated', shifts },
    compliance: { from: 'How old are you?', to: `Are you ${minAge} or older?` },
    knockout: [
      `Are you ${minAge} or older?`,
      'Are you allowed to work in the US?',
      ...(needsLicense ? ["Do you have a driver's license and your own car?"] : []),
      `Which shifts can you work? (${shifts.join(', ')})`,
      'When could you start?',
      ...(tasks.length ? [`Are you comfortable working the ${tasks.join(' and ')}?`] : []),
    ],
    voice: [
      'How would you get to the store, and how long does it take?',
      `What made you apply for the ${title} job?`,
      'Tell me about a time you helped a customer or worked in a team.',
      'A customer says their order is wrong and they are upset. What do you do?',
      'How many hours a week are you looking for?',
    ],
  };
}

const PEOPLE = {

let D;
function resetDash(){
  D = {
    today: [
      { id:'t1', time:'2:00 PM', c:'alex',   st:'confirmed', note:'Replied yes to the reminder' },

resetDash();

/* ================= router ================= */
let heroTimer = null;
function parse(){ const [r, sub] = location.hash.replace(/^#\/?/, '').split('/'); return { r: r || 'landing', sub }; }
const VIEWS = { landing, job, review, availability, live, dashboard, times, jobs };
function go(r){ location.hash = '#/' + r; }
function render(){
  clearTimeout(heroTimer);
  const { r, sub } = parse();
  const view = VIEWS[r] || landing;
  $('app').innerHTML = view(sub);
  renderBar();
  window.scrollTo(0, 0);
  AFTER[r] && AFTER[r](sub);
}
window.addEventListener('hashchange', render);
const AFTER = {};

/* ================= prototype bar (guides the reviewer) ================= */
let barMsg = null;
function renderBar(){
  const { r } = parse(), b = $('pbar');
  const n = $('narr');
  if (barMsg) {
    const [step, ...rest] = barMsg.split(' · ');
    b.innerHTML = `<span class="tagp">Demo</span><span class="msg live">${barMsg}</span><span class="msg short">Playing step ${step}…</span>`;
    n.innerHTML = `<b>Step ${step}</b> · ${rest.join(' · ')}`; n.classList.add('on');
    return;
  }
  n.classList.remove('on');
  if (r === 'dashboard') {
    b.innerHTML = `<span class="tagp">Prototype</span><span class="msg"><span class="long">Play what Slotwise does on its own:</span></span>
      <button class="pri" data-a="sim1" ${D.sim1 ? 'disabled' : ''}>${ic('play')}<span class="long">Someone cancels</span><span class="short">Cancel</span></button>
      <button data-a="sim2" ${D.sim2 ? 'disabled' : ''}>${ic('play')}<span class="long">No one can take it</span><span class="short">No match</span></button>
      <button data-a="reset" aria-label="Reset demo">${ic('refresh')}<span class="long">Reset</span></button>`;
  } else {
    b.innerHTML = `<span class="tagp">Prototype</span><span class="msg"><span class="long">Sample data. Nothing is sent to anyone.</span></span>
      <button class="pri" data-a="watch">${ic('play')}<span class="long">Watch a cancelled slot get filled</span><span class="short">Watch demo</span></button>`;
  }
}
function setBar(msg){ barMsg = msg; renderBar(); }

/* ================= shared bits ================= */
const logo = (href = '#/landing') => `<a class="logo" href="${href}"><span class="logo-mark">${ic('calcheck')}</span>Slotwise</a>`;
function toast(msg){
  const t = $('toast'); t.innerHTML = ic('check') + `<span>${esc(msg)}</span>`; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2800);
}
function slotRow(s, extra = ''){
  const p = PEOPLE[s.c], [lab, cls] = STATUS[s.st];
  return `<div class="slot" id="${s.id || ''}">
    <div class="t">${s.time}<small>30 min</small></div>
    <div class="who"><span class="avatar">${p.i}</span><div style="min-width:0"><b>${p.n}</b>${s.note ? `<span class="note">${esc(s.note)}</span>` : ''}</div></div>
    <div class="st">${extra || `<span class="pill ${cls}">${lab}</span>`}</div></div>`;
}
function setupTop(step){
  const names = ['Choose the job','Check questions','Interview times'];
  const items = names.map((n, i) => {
    const cls = i + 1 < step ? 'done' : i + 1 === step ? 'on' : '';
    return `${i ? '<span class="st-line"></span>' : ''}<div class="st-i ${cls}"><span class="c">${i + 1 < step ? ic('check') : i + 1}</span>${n}</div>`;
  }).join('');
  return `<div class="ob-top">${logo()}<div class="stepper">${items}</div><div class="step-mini">Step ${step} of 3</div>
    <a class="btn btn-ghost btn-sm" href="#/dashboard"><span class="long">Skip to dashboard</span><span class="short">Skip</span></a></div>`;
}
function shell(active, content){
  const items = [['dashboard','home','Today'],['times','cal','Interview times'],['jobs','brief','Job']];
  return `<div class="shell">
    <aside class="side">${logo()}
      ${items.map(([r, i, n]) => `<a class="nav-i ${active === r ? 'on' : ''}" href="#/${r}">${ic(i)}${n}</a>`).join('')}
      <div class="side-foot"><span class="avatar">MG</span><div><b style="font-size:13px">Maria Gomez</b><div class="muted" style="font-size:12px">Store #214</div></div></div>

    <div style="min-width:0">
      <div class="topm">${logo()}<span class="avatar">MG</span></div>
      <main class="main">${content}</main>
    </div>
    <nav class="tabs">${items.map(([r, i, n]) => `<a class="${active === r ? 'on' : ''}" href="#/${r}">${ic(i)}${n}</a>`).join('')}</nav>

}

/* ================= 1. LANDING ================= */
const HERO_STEPS = [
  { c:'jordan', st:'atrisk',    note:"Hasn't replied yet. We'll call to check.", cap:'Jordan hasn\'t confirmed yet…' },
  { c:'jordan', st:'calling',   note:'Calling to check if they\'re coming',       cap:'Slotwise calls to check.' },

  { c:'priya',  st:'offer',     note:'Offered to the best fit on the waiting list', cap:'The best waiting candidate gets a text.' },
  { c:'priya',  st:'confirmed', note:'Took the slot from the waiting list',        cap:'Slot filled. Maria didn\'t lift a finger.' },
];
function landing(){
  return `
  <nav class="nav">${logo()}
    <div class="nav-links"><a href="#how" data-a="scrollhow">How it works</a></div>
    <div class="row"><a class="btn btn-ghost btn-sm" href="#/dashboard">Log in</a><a class="btn btn-primary btn-sm" href="#/job">Get started</a></div>
  </nav>

/* ================= 4. INTERVIEW TIMES ================= */
const toMin = t => { const [hm, ap] = t.split(' '); let [h, m] = hm.split(':').map(Number); if (ap === 'PM' && h !== 12) h += 12; if (ap === 'AM' && h === 12) h = 0; return h * 60 + m; };
const toLabel = m => { const h = Math.floor(m / 60), mm = m % 60, ap = h >= 12 ? 'PM' : 'AM', hh = ((h + 11) % 12) + 1; return `${hh}:${String(mm).padStart(2, '0')} ${ap}`; };
const HOURS = Array.from({ length: 31 }, (_, i) => toLabel(7 * 60 + i * 30));
const DOW = [['Mon',1],['Tue',2],['Wed',3],['Thu',4],['Fri',5],['Sat',6],['Sun',0]];
const BOOKED = { '2026-11-12': new Set(['2:00 PM']) };
const fmtShort = d => d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
const fmtLong = d => d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
function daySlots(){ const a = S.av, out = []; for (let m = toMin(a.from); m + a.slotLen <= toMin(a.to); m += a.slotLen) out.push(toLabel(m)); return out; }
function bookableDays(){ const out = []; for (let n = 1; n <= 2; n++) { const d = new Date(2026, 10, 11 + n); if (S.av.days.has(d.getDay())) out.push(d); } return out; }

function avForm(){
  const a = S.av, slots = daySlots(), perWeek = slots.length * a.days.size;
  const names = DOW.filter(([, i]) => a.days.has(i)).map(([n]) => n);
  const weekdays = names.length === 5 && !a.days.has(0) && !a.days.has(6);
  const sum = !a.days.size ? '<b>Pick at least one day</b>'
    : !slots.length ? '<b>Pick an end time after the start time</b>'
    : `<b>${perWeek} interviews a week</b><span class="muted">${slots.length} a day · ${weekdays ? 'Weekdays' : names.join(', ')}</span>
       <div class="schips">${slots.map(t => `<span class="schip">${t}</span>`).join('')}</div>`;
  const opts = sel => HOURS.map(t => `<option ${t === sel ? 'selected' : ''}>${t}</option>`).join('');
  return `<div class="card av-card">
      <div class="av-sec"><label>Days</label>
        <div class="dchips">${DOW.map(([n, i]) => `<button class="dchip ${a.days.has(i) ? 'on' : ''}" data-a="avday" data-v="${i}" aria-pressed="${a.days.has(i)}">${n}</button>`).join('')}</div></div>
      <div class="av-sec"><label>Time</label>
        <div class="row" style="gap:10px"><select class="av-sel" id="avfrom" aria-label="From">${opts(a.from)}</select><span class="muted">to</span><select class="av-sel" id="avto" aria-label="To">${opts(a.to)}</select></div></div>
      <div class="av-sec"><label>Each interview</label>
        <div class="seg">${[15,20,30].map(n => `<button class="${a.slotLen === n ? 'on' : ''}" data-a="len" data-v="${n}">${n} min</button>`).join('')}</div></div>
      <div class="av-sum">${sum}</div>
    </div>
    <div class="av-note">${ic('pin')}<span>Interviews at ${esc(S.job.location)}. Candidates are told to ask for Maria.</span></div>`;
}
function candidatePreview(){

function statusLine(){
  const pending = D.today.filter(s => ['atrisk','calling','released','offer'].includes(s.st)).length;

    ? `<span class="pill p-amber">${pending} not confirmed yet</span><span class="muted">We're following up for you.</span>`
    : `<span class="pill p-green">All set</span><span class="muted">Everyone today has confirmed.</span>`;
}
const WEEK_DAYS = [['Mon','9'],['Tue','10'],['Wed','11'],['Thu','12'],['Fri','13']];
const TIMES = ['2:00 PM','2:30 PM'];
function cellOf(d, ti){ return d === 'Wed' ? D.today[ti] : D.week[d][ti]; }
function cellLabel(s){ return s.refilled ? 'Came · refilled' : STATUS[s.st][0]; }
function weekHtml(){
  let g = '<div></div>' + WEEK_DAYS.map(([d, n]) => `<div class="wh ${d === 'Wed' ? 'today' : ''}">${d} ${n}</div>`).join('');
  TIMES.forEach((t, ti) => {
    g += `<div class="wt">${t.replace(':00 PM', 'pm').replace(':30 PM', ':30')}</div>`;
    WEEK_DAYS.forEach(([d]) => { const s = cellOf(d, ti);
      g += `<div class="wc c-${s.st} ${d === 'Wed' ? 'today' : ''}" id="w-${d}-${ti}"><b>${PEOPLE[s.c].n.split(' ')[0]}</b><span>${cellLabel(s)}</span></div>`; });
  });
  const list = WEEK_DAYS.map(([d, n]) => `<div class="wday"><div class="dn ${d === 'Wed' ? 'today' : ''}">${d} ${n}</div><div class="ds">${TIMES.map((t, ti) => {
      const s = cellOf(d, ti), [lab, cls] = STATUS[s.st];
      return `<div class="wi"><span>${t} · ${PEOPLE[s.c].n.split(' ')[0]}</span><span class="pill ${cls}">${s.refilled ? 'Came' : lab}</span></div>`; }).join('')}</div></div>`).join('');
  return `<div class="week">${g}</div><div class="wlist">${list}</div>
    <div class="legend"><span><i style="background:var(--green-bg);border:1px solid var(--green)"></i>Confirmed</span><span><i style="background:var(--amber-bg);border:1px solid var(--amber)"></i>Waiting for reply</span><span><i style="background:var(--grey-bg)"></i>Done</span><span><i style="background:repeating-linear-gradient(45deg,#ddd,#ddd 2px,#fff 2px,#fff 4px)"></i>Free time</span></div>`;
}
function markHtml(){
  const rows = D.week.Tue.map((s, ti) => {
    const btns = s.st === 'tomark'
      ? `<button class="mk yes" data-a="mark" data-i="${ti}" data-v="attended">Came</button><button class="mk no" data-a="mark" data-i="${ti}" data-v="noshow">Didn't come</button>` : '';
    const note = s.st === 'noshow' ? 'Paused from booking here for 30 days' : s.st === 'attended' ? 'Marked as came' : 'Did they come to the interview?';
    return slotRow({ time: TIMES[ti], c: s.c, st: s.st, note }, btns);
  }).join('');
  const done = D.week.Tue.every(s => s.st !== 'tomark');
  return `<div class="panel-h"><div><h3>Yesterday</h3><p>${done ? 'All marked. Thanks!' : 'Tap one for each. It takes 2 seconds.'}</p></div></div>${rows}`;
}
function waitHtml(){
  if (!D.wait.length) return '<p class="muted" style="font-size:13px;padding:8px 0">No one is waiting right now.</p>';
  return D.wait.map((id, i) => { const p = PEOPLE[id];
    return `<div class="wl" id="wl-${id}"><span class="avatar">${p.i}</span><div style="min-width:0"><b>${p.n}</b><span class="n">Prefers ${p.pref.toLowerCase()}</span></div>
      <div>${i === 0 ? '<span class="pill p-green">Best fit</span>' : ''}</div></div>`; }).join('');
}
function dashboard(){
  return shell('dashboard', `
    <div class="d-head">
      <div><div class="muted" style="font-size:13px">Wednesday, November 11</div><h1>Hi, Maria</h1><div class="status" id="statusline">${statusLine()}</div></div>
      <button class="btn btn-ghost btn-sm" data-a="copylink">${ic('link')} Share apply link</button>
    </div>
    <div class="d-grid">
      <div class="stack">
        <div class="card panel"><div class="panel-h"><h3>Today's interviews</h3></div><div id="today">${D.today.map(s => slotRow(s)).join('')}</div></div>
        <div class="card panel" id="markp">${markHtml()}</div>
        <div class="card panel"><div class="panel-h"><h3>This week</h3><span class="muted" style="font-size:12.5px">Nov 9 – 13</span></div><div id="weekwrap">${weekHtml()}</div></div>
      </div>
      <div class="stack">
        <div class="card panel"><div class="panel-h"><div><h3>Waiting for a slot</h3><p id="wlcnt">${D.wait.length} people, already screened</p></div></div>
          <div id="wait">${waitHtml()}</div>
          <p class="muted" style="font-size:12.5px;margin-top:10px">When a slot opens, we offer it to the best fit first. They have 30 minutes to take it.</p></div>
      </div>
    </div>`);
}
function redraw(flashId){
  if ($('today')) $('today').innerHTML = D.today.map(s => slotRow(s)).join('');
  if ($('statusline')) $('statusline').innerHTML = statusLine();
  if ($('weekwrap')) $('weekwrap').innerHTML = weekHtml();
  if ($('markp')) $('markp').innerHTML = markHtml();
  if (flashId && $(flashId)) $(flashId).classList.add('flash');
}

/* ---- demo stories ---- */
const wait = ms => new Promise(r => setTimeout(r, ms));
async function sim1(){
  if (D.sim1 || D.running) return; D.running = true;
  const s = D.today[1];
  s.st = 'calling'; s.note = "Calling to check if they're coming"; redraw('t2');
  setBar("1/4 · Jordan didn't reply to yesterday's reminder, so Slotwise calls to check.");
  await wait(2300);
  s.st = 'released'; s.note = "Can't come today. Moved to next week."; redraw('t2');
  setBar("2/4 · Jordan can't come. They keep their screening and get next week's times.");
  await wait(2300);
  $('wl-priya')?.classList.add('hl');
  s.c = 'priya'; s.st = 'offer'; s.note = 'Offered to the best fit on the waiting list'; redraw('t2');
  setBar('3/4 · Priya is the best fit waiting. Priya gets a text: “2:30 PM opened today. Tap to take it.”');
  await wait(2600);
  s.st = 'confirmed'; s.note = 'Took the slot from the waiting list'; redraw('t2');
  D.wait = D.wait.filter(x => x !== 'priya');
  const wl = $('wl-priya'); if (wl) { wl.classList.add('gone'); await wait(350); }
  if ($('wait')) $('wait').innerHTML = waitHtml();
  if ($('wlcnt')) $('wlcnt').textContent = D.wait.length + ' people, already screened';
  setBar("4/4 · Priya took the slot. Maria didn't have to do anything.");
  D.sim1 = true; D.running = false;
  await wait(3200); setBar(null);
}
async function sim2(){
  if (D.sim2 || D.running) return; D.running = true;
  const s = D.week.Fri[1];
  s.st = 'released'; redraw('w-Fri-1');
  setBar('1/3 · Ava cancelled Friday 2:30 PM.');
  await wait(2200);
  s.st = 'offer'; redraw('w-Fri-1');
  setBar('2/3 · Offered to the waiting list. No one can make Friday afternoon.');
  await wait(2400);
  s.st = 'freed'; redraw('w-Fri-1');
  setBar('3/3 · Two hours before, Maria is told: that half hour is hers again.');
  D.sim2 = true; D.running = false;
  await wait(3200); setBar(null);
}

/* ================= 7. INTERVIEW TIMES (in the app) ================= */
function times(){
  return shell('times', `<div style="max-width:680px">
    <div class="page-h"><h1>Interview times</h1><p>Candidates can book these, up to 2 days ahead.</p></div>
    ${avForm()}
    <div class="foot-btns" style="justify-content:flex-end"><button class="btn btn-primary" data-a="savetimes">Save changes</button></div></div>`);
}
AFTER.times = bindAv;

/* ================= 8. JOB (in the app) ================= */
function jobs(){
  const s = S.gen ? S.gen.summary : { pay:'$15–$17/hr', shifts:['Mornings','Afternoons','Evenings','Weekends'] };
  return shell('jobs', `<div style="max-width:680px">
    <div class="page-h"><h1>Your job</h1></div>
    <div class="card job-card">
      <div class="row between wrap" style="gap:10px"><div><h3 style="font-size:19px">${esc(jobTitle())}</h3><p class="muted" style="font-size:13px;margin-top:2px">${esc(S.job.location)}</p></div><span class="pill p-green">Live</span></div>
      <div class="chips" style="margin:14px 0 6px"><span class="tag">${esc(s.pay)}</span><span class="tag">${esc(s.shifts.join(', '))}</span></div>
      <div class="row-l"><div><b>Screening questions</b><p class="muted" style="font-size:13px">Quick form and AI phone call</p></div><a class="btn btn-ghost btn-sm" href="#/review/edit">Edit</a></div>
      <div class="row-l"><div><b>Interview times</b><p class="muted" style="font-size:13px">${esc(S.av.from)}–${esc(S.av.to)} · ${S.av.days.size} days a week</p></div><a class="btn btn-ghost btn-sm" href="#/times">Edit</a></div>
      <div class="row-l"><div><b>Apply link and poster</b><p class="muted" style="font-size:13px">${APPLY_LINK}</p></div><a class="btn btn-ghost btn-sm" href="#/live">Open</a></div>
    </div></div>`);
}

/* ================= actions ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  const A = {
    scrollhow: () => $('how')?.scrollIntoView({ behavior:'smooth' }),
    tpl: () => {
      const j = S.job;
      if (v === 'own') { if (j.tpl !== 'own') { j.title = ''; j.jd = ''; } }
      else { j.title = TEMPLATES[v].title; j.jd = TEMPLATES[v].jd; j.file = null; }
      j.tpl = v; j.showJd = false; render();
    },
    showjd: () => { S.job.showJd = !S.job.showJd; render(); },
    upload: () => $('file')?.click(),
    generate: () => { if (!canGen()) return; S.generating = true; render(); },
    delq: () => { S.gen[el.dataset.k].splice(+el.dataset.i, 1); render(); },
    addq: () => {
      const k = el.dataset.k; S.gen[k].push('New question'); render();
      const all = document.querySelectorAll(`.q textarea[data-k="${k}"]`), last = all[all.length - 1];
      if (last) { last.focus(); last.select(); }
    },
    foldvoice: () => { S.voiceOpen = !S.voiceOpen; render(); },
    saveqs: () => go('availability'),
    saveedit: () => { toast('Questions saved'); go('jobs'); },
    avtab: () => { S.av.tab = v; render(); },
    avday: () => { const d = +v; S.av.days.has(d) ? S.av.days.delete(d) : S.av.days.add(d); S.av.cSel = null; render(); },
    len: () => { S.av.slotLen = +v; S.av.cSel = null; render(); },
    ctime: () => { S.av.cSel = el.dataset.t; render(); },
    cbook: () => { S.av.cBooked = true; render(); },
    crestart: () => { S.av.cBooked = false; S.av.cSel = null; render(); },
    golive: () => { S.av.tab = 'hirer'; go('live'); },
    savetimes: () => toast('Saved. Candidates will see the new times.'),
    copylink: () => {
      const done = () => toast('Apply link copied');
      try { navigator.clipboard.writeText('https://' + APPLY_LINK).then(done, done); } catch (_) { done(); }
    },
    print: () => window.print(),
    mark: () => {
      const s = D.week.Tue[+el.dataset.i]; s.st = v; redraw();
      toast(v === 'noshow' ? `${PEOPLE[s.c].n} can't book at this store for 30 days` : `Marked ${PEOPLE[s.c].n} as came`);
    },
    watch: () => { go('dashboard'); setTimeout(sim1, 700); },
    sim1: () => sim1(),
    sim2: () => sim2(),
    reset: () => { if (D.running) return; resetDash(); barMsg = null; render(); },
  };
  if (A[a]) { e.preventDefault(); A[a](); }
});

render();
</script>
